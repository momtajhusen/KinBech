# KinBech API — nginx site for VPS
# Install:
#   sudo cp deploy/nginx-kinbech-api.conf /etc/nginx/sites-available/kinbech-api.codersalpha.com
#   sudo ln -sf /etc/nginx/sites-available/kinbech-api.codersalpha.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kinbech-api.codersalpha.com
#
# DNS: A record kinbech-api.codersalpha.com → your VPS IP (148.230.67.252)

server {
    listen 80;
    server_name kinbech-api.codersalpha.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
