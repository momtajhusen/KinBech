# KinBech API — nginx site for VPS
# Prefer live host kinbechapi (no hyphen). Also accept kinbech-api for old mobile builds.
#
# Install / update:
#   sudo nano /etc/nginx/sites-available/kinbechapi   # or kinbechapi.codersalpha.com
#   Add both names to server_name, then:
#   sudo certbot --nginx -d kinbechapi.codersalpha.com -d kinbech-api.codersalpha.com --expand
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: A records for BOTH:
#   kinbechapi.codersalpha.com  → 148.230.67.252
#   kinbech-api.codersalpha.com → 148.230.67.252

server {
    listen 80;
    server_name kinbechapi.codersalpha.com kinbech-api.codersalpha.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
